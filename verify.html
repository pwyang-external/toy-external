<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상품권 진위 확인</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 480px; margin: 20px auto; padding: 0 16px; line-height: 1.5; color: #222; }
  h1 { font-size: 20px; text-align: center; }
  label { display: block; font-weight: bold; margin-top: 14px; font-size: 14px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 4px; font-size: 16px; }
  button { width: 100%; margin-top: 16px; padding: 14px; font-size: 17px; cursor: pointer; }
  #result { margin-top: 20px; padding: 18px; border-radius: 10px; font-size: 17px; text-align: center; display: none; }
  .ok { background: #e6f7e9; border: 2px solid #2e7d32; color: #1b5e20; }
  .bad { background: #fdecea; border: 2px solid #c62828; color: #b71c1c; }
  .expired { background: #fff3e0; border: 2px solid #ef6c00; color: #e65100; }
  .used { background: #eceff1; border: 2px solid #607d8b; color: #37474f; }
  .detail { font-size: 13px; margin-top: 8px; font-weight: normal; }
  .note { color: #666; font-size: 12px; margin-top: 20px; }
  #useBtn { background: #607d8b; color: white; border: none; display: none; }
  #resetBtn { background: none; border: none; color: #888; font-size: 12px; text-decoration: underline; margin-top: 6px; width: auto; padding: 4px; }
  details { margin-top: 16px; border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px; }
  summary { cursor: pointer; font-weight: bold; font-size: 14px; }
</style>
</head>
<body>

<h1>🔍 상품권 진위 확인</h1>

<details id="ghSettings">
  <summary>⚙️ GitHub 연동 설정 (사용 여부 공유 조회, 최초 1회만 입력)</summary>
  <label>GitHub 계정/조직 (owner)</label>
  <input id="gh_owner" type="text" placeholder="예: junyoungkim">
  <label>저장소 이름 (repo)</label>
  <input id="gh_repo" type="text" placeholder="예: voucher-qr">
  <label>브랜치</label>
  <input id="gh_branch" type="text" value="main">
  <label>JSON 파일 경로</label>
  <input id="gh_path" type="text" value="vouchers.json">
  <label>Fine-grained PAT (이 저장소 전용, Contents 권한만)</label>
  <input id="gh_token" type="password" placeholder="github_pat_...">
  <button onclick="saveGhConfig()">설정 저장 (이 기기에만 저장됨)</button>
  <p class="note" id="ghStatus"></p>
</details>

<label>비밀키 (발급 시 사용한 것과 동일)</label>
<input id="secret" type="password" placeholder="비밀키 입력">

<label>상품권 코드 (QR 스캔 후 나온 텍스트를 붙여넣기)</label>
<input id="code" type="text" placeholder="예: A1B2C9-10000-20261231-3F9A2C1B4E5D" autocomplete="off">

<button onclick="verify()">확인하기</button>

<div id="result"></div>
<button id="useBtn" onclick="markUsed()">이 코드 사용 처리하기 (이 기기에만 기록)</button>

<p class="note">
  ℹ️ 서명(위조) 검증은 인터넷 없이도 동작합니다. "이미 사용됨" 여부는 GitHub에 설정해두면
  여러 기기가 공유해서 확인합니다 — 단, 그 순간에는 인터넷 연결이 필요합니다.
  네트워크가 안 되면 이 기기에만 기록되는 방식으로 자동 대체됩니다.
</p>
<button id="resetBtn" onclick="resetUsed()">이 기기의 로컬 사용기록 초기화</button>

<script src="github-sync.js"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const cfg = ghLoadConfig();
  document.getElementById('gh_owner').value = cfg.owner || '';
  document.getElementById('gh_repo').value = cfg.repo || '';
  document.getElementById('gh_branch').value = cfg.branch || 'main';
  document.getElementById('gh_path').value = cfg.path || 'vouchers.json';
  document.getElementById('gh_token').value = cfg.token || '';
  if (cfg.owner) {
    document.getElementById('ghStatus').textContent = '저장된 설정을 불러왔습니다.';
  } else {
    document.getElementById('ghSettings').open = true; // 최초엔 펼쳐서 보여줌
  }
});

function readGhConfigFromForm() {
  return {
    owner: document.getElementById('gh_owner').value.trim(),
    repo: document.getElementById('gh_repo').value.trim(),
    branch: document.getElementById('gh_branch').value.trim() || 'main',
    path: document.getElementById('gh_path').value.trim() || 'vouchers.json',
    token: document.getElementById('gh_token').value.trim()
  };
}

function saveGhConfig() {
  const cfg = readGhConfigFromForm();
  ghSaveConfig(cfg);
  document.getElementById('ghStatus').textContent = '저장되었습니다.';
}

function ghConfigReady(cfg) {
  return !!(cfg.owner && cfg.repo && cfg.token);
}

async function hmacHex(secret, message) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey(
    'raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
  );
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
  return [...new Uint8Array(sig)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function getUsedSet() {
  return new Set(JSON.parse(localStorage.getItem('usedVoucherCodes') || '[]'));
}
function saveUsedSet(set) {
  localStorage.setItem('usedVoucherCodes', JSON.stringify([...set]));
}

let currentValidCode = null;
let currentSerial = null;
let currentUseMode = null; // 'github' | 'local'

function showResult(cls, html) {
  const el = document.getElementById('result');
  el.className = cls;
  el.innerHTML = html;
  el.style.display = 'block';
}

async function verify() {
  const secret = document.getElementById('secret').value.trim();
  const rawCode = document.getElementById('code').value.trim().toUpperCase();
  document.getElementById('useBtn').style.display = 'none';
  currentValidCode = null;

  if (!secret) { alert('비밀키를 입력하세요.'); return; }
  if (!rawCode) { alert('코드를 입력하세요.'); return; }

  const parts = rawCode.split('-');
  if (parts.length !== 4) {
    showResult('bad', '❌ 형식이 올바르지 않은 코드입니다.');
    return;
  }
  const [serial, amount, expiry, sig] = parts;

  const payload = `${serial}|${amount}|${expiry}`;
  const expectedFull = await hmacHex(secret, payload);
  const expected = expectedFull.slice(0, sig.length).toUpperCase();

  if (expected !== sig) {
    showResult('bad', '❌ 위조되었거나 잘못된 코드입니다.<div class="detail">서명이 일치하지 않습니다.</div>');
    return;
  }

  // 서명은 정상 → 만료일 체크
  const today = new Date();
  const todayStr = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}`;

  if (expiry < todayStr) {
    showResult('expired', '⏰ 서명은 정상이지만, 유효기간이 만료되었습니다.<div class="detail">' +
      `금액 ${Number(amount).toLocaleString()}원 · 만료 ${formatDate(expiry)}</div>`);
    return;
  }

  const detail = `금액 ${Number(amount).toLocaleString()}원 · 만료 ${formatDate(expiry)}까지`;
  const ghCfg = readGhConfigFromForm();

  if (ghConfigReady(ghCfg)) {
    // GitHub에서 공유 사용기록 확인 시도
    try {
      const { list } = await ghGetFile(ghCfg);
      const entry = list.find(v => v.serial === serial);
      if (!entry) {
        showResult('bad', '❌ 발급 기록에 없는 코드입니다 (GitHub 등록 목록 기준).<div class="detail">서명은 맞지만 발급대장에 없습니다.</div>');
        return;
      }
      if (entry.used) {
        showResult('used', `⚠️ 이미 사용 처리된 코드입니다.<div class="detail">${detail}<br>사용 시각: ${entry.usedAt || '-'}</div>`);
        return;
      }
      showResult('ok', `✅ 정상 상품권입니다.<div class="detail">${detail}<br><span style="color:#2e7d32">(GitHub 공유 기록 기준 미사용)</span></div>`);
      currentValidCode = rawCode;
      currentSerial = serial;
      currentUseMode = 'github';
      document.getElementById('useBtn').style.display = 'block';
      return;
    } catch (e) {
      // 네트워크/설정 문제 → 로컬 모드로 대체
      console.warn('GitHub 조회 실패, 로컬 모드로 대체:', e.message);
    }
  }

  // 로컬(오프라인) 모드: 이 기기 안에서만 사용여부 확인
  const usedSet = getUsedSet();
  if (usedSet.has(rawCode)) {
    showResult('used', `⚠️ 이미 이 기기에서 사용 처리된 코드입니다. (오프라인 모드)<div class="detail">${detail}</div>`);
    return;
  }
  showResult('ok', `✅ 정상 상품권입니다. (오프라인 모드 — 이 기기 기록만 확인됨)<div class="detail">${detail}</div>`);
  currentValidCode = rawCode;
  currentSerial = serial;
  currentUseMode = 'local';
  document.getElementById('useBtn').style.display = 'block';
}

async function markUsed() {
  const btn = document.getElementById('useBtn');
  btn.disabled = true;
  try {
    if (currentUseMode === 'github') {
      const ghCfg = readGhConfigFromForm();
      const usedAt = new Date().toISOString();
      await ghPutFile(
        ghCfg,
        (list) => {
          const idx = list.findIndex(v => v.serial === currentSerial);
          if (idx === -1) throw new Error('발급 기록을 찾을 수 없습니다.');
          if (list[idx].used) throw new Error('다른 기기에서 방금 먼저 사용 처리했습니다.');
          list[idx] = { ...list[idx], used: true, usedAt };
          return list;
        },
        `사용 처리: ${currentSerial}`
      );
      showResult('used', '✔️ 사용 처리 완료 (GitHub 공유 기록에 반영됨)');
    } else {
      const set = getUsedSet();
      set.add(currentValidCode);
      saveUsedSet(set);
      showResult('used', '✔️ 사용 처리 완료 (이 기기에만 기록됨, 오프라인 모드)');
    }
    btn.style.display = 'none';
  } catch (e) {
    alert(`사용 처리 실패: ${e.message}`);
    btn.disabled = false;
  }
}

function resetUsed() {
  if (confirm('이 기기에 기록된 사용 목록을 모두 초기화할까요?')) {
    localStorage.removeItem('usedVoucherCodes');
    alert('초기화되었습니다.');
  }
}

function formatDate(yyyymmdd) {
  return `${yyyymmdd.slice(0,4)}-${yyyymmdd.slice(4,6)}-${yyyymmdd.slice(6,8)}`;
}
</script>
</body>
</html>
