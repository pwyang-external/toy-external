<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상품권 진위 확인</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 480px; margin: 20px auto; padding: 0 16px; line-height: 1.5; color: #222; }
  h1 { font-size: 20px; text-align: center; }
  label { display: block; font-weight: bold; margin-top: 14px; font-size: 14px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 4px; font-size: 16px; }
  button { width: 100%; margin-top: 16px; padding: 14px; font-size: 17px; cursor: pointer; }
  #result { margin-top: 20px; padding: 18px; border-radius: 10px; font-size: 17px; text-align: center; display: none; }
  .ok { background: #e6f7e9; border: 2px solid #2e7d32; color: #1b5e20; }
  .bad { background: #fdecea; border: 2px solid #c62828; color: #b71c1c; }
  .expired { background: #fff3e0; border: 2px solid #ef6c00; color: #e65100; }
  .used { background: #eceff1; border: 2px solid #607d8b; color: #37474f; }
  .detail { font-size: 13px; margin-top: 8px; font-weight: normal; }
  .note { color: #666; font-size: 12px; margin-top: 20px; }
  #useBtn { background: #607d8b; color: white; border: none; display: none; }
  .link-btn { background: none; border: none; color: #888; font-size: 12px; text-decoration: underline; margin-top: 6px; width: auto; padding: 4px; }
</style>
</head>
<body>

<h1>🔍 상품권 진위 확인</h1>

<p class="note" id="ghStatus">GitHub 연동 상태 확인 중...</p>

<label>비밀키 (발급 시 사용한 것과 동일)</label>
<input id="secret" type="password" placeholder="비밀키 입력">

<label>상품권 코드 (QR 스캔 후 나온 텍스트를 붙여넣기)</label>
<input id="code" type="text" placeholder="예: A1B2F9C3" autocomplete="off" maxlength="12">

<button onclick="verify()">확인하기</button>

<div id="result"></div>
<button id="useBtn" onclick="markUsed()">이 코드 사용 처리하기 (이 기기에만 기록)</button>

<p class="note">
  ℹ️ 코드가 진짜로 발급된 것인지(위조 여부)는 인터넷 없이도 확인됩니다. 다만 금액·유효기간·이미 사용됐는지는
  코드 안에 들어있지 않고 GitHub의 발급대장(vouchers.json)에서만 알 수 있어서, 그 부분은 인터넷 연결이 필요합니다.
</p>
<button class="link-btn" onclick="resetUsed()">이 기기의 로컬 사용기록 초기화</button>
<button class="link-btn" onclick="resetSecretCache()">이 기기에 저장된 비밀키 지우기</button>
<button class="link-btn" onclick="resetGhConfigCache()">이 기기에 저장된 GitHub 설정 캐시 지우기</button>

<script src="github-sync.js"></script>
<script src="crypto-config.js"></script>
<script>
let pendingEncryptedBlob = null;
// GitHub 설정은 화면 입력칸이 없고, 이 변수 하나로만 관리됩니다.
// make-config.html이 만든 암호화 파일에서만 채워집니다.
let currentGhCfg = { owner: '', repo: '', branch: 'main', path: 'vouchers.json', token: '' };

// issue.html과 반드시 같은 값이어야 합니다 (코드 = 일련번호 + 서명, 구분자 없이 총 8자리).
const SERIAL_LEN = 4;
const SIG_LEN = 4;

function ghConfigReady(cfg) {
  return !!(cfg.owner && cfg.repo && cfg.token);
}

function setGhCfg(cfg, statusMsg) {
  currentGhCfg = { branch: 'main', path: 'vouchers.json', ...cfg };
  document.getElementById('ghStatus').textContent = statusMsg;
}

window.addEventListener('DOMContentLoaded', async () => {
  // QR을 "verify.html?code=..." 형태로 스캔해서 들어온 경우, 코드 입력창을 자동으로 채움
  const params = new URLSearchParams(window.location.search);
  const codeParam = params.get('code');
  if (codeParam) document.getElementById('code').value = codeParam;

  // 이 기기에서 이전에 입력한 비밀키가 있으면 자동으로 채움
  const savedSecret = localStorage.getItem('voucherSecretCache');
  if (savedSecret) document.getElementById('secret').value = savedSecret;

  // GitHub 설정 로드
  const cached = ghLoadConfig();
  if (cached.owner) {
    setGhCfg(cached, '✅ 저장된 GitHub 설정을 불러왔습니다.');
  } else {
    // 저장된 설정이 없으면 암호화된 설정 파일이 있는지만 미리 받아둠
    // (암호는 아래 verify()에서 "비밀키" 입력값으로 자동 시도합니다 — 별도 입력 없음)
    try {
      const res = await fetch('./github-config.encrypted.json');
      if (res.ok) {
        pendingEncryptedBlob = await res.json();
        document.getElementById('ghStatus').textContent = '🔒 암호화된 설정 파일을 찾았습니다. 비밀키를 입력하면 자동으로 풀립니다.';
      } else {
        document.getElementById('ghStatus').textContent = '⚠️ GitHub 설정을 찾지 못했습니다 — 사용 여부는 이 기기 로컬 기록으로만 확인됩니다.';
      }
    } catch (e) {
      document.getElementById('ghStatus').textContent = '⚠️ GitHub 설정을 찾지 못했습니다 — 이 기기 로컬 기록으로만 확인됩니다.';
    }
  }

  // 코드와 비밀키가 둘 다 이미 채워져 있으면(QR 스캔 + 이 기기에서 기억된 비밀키) 바로 확인까지 자동 실행
  if (codeParam && savedSecret) {
    verify();
  }
});

// "비밀키" 입력값으로 암호화된 GitHub 설정 복호화를 시도.
// make-config.html에서 이 비밀키와 같은 값으로 암호화해뒀다면 성공해서 자동 채워지고,
// 다르면 조용히 실패 → 로컬 모드로 진행 (사용자에게 별도 에러를 띄우지 않음).
async function tryAutoUnlockWithSecret(secret) {
  if (!pendingEncryptedBlob) return null;
  try {
    const cfg = await decryptConfig(pendingEncryptedBlob, secret);
    setGhCfg(cfg, '✅ 비밀키로 GitHub 설정 자동 해제됨.');
    ghSaveConfig(cfg); // 성공하면 캐시 → 다음부터는 이 기기에서 다시 시도 안 함
    pendingEncryptedBlob = null;
    return cfg;
  } catch (e) {
    return null; // 비밀키가 암호화 암호와 다름 → 그냥 로컬 모드
  }
}

async function hmacHex(secret, message) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey(
    'raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
  );
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
  return [...new Uint8Array(sig)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function getUsedSet() {
  return new Set(JSON.parse(localStorage.getItem('usedVoucherCodes') || '[]'));
}
function saveUsedSet(set) {
  localStorage.setItem('usedVoucherCodes', JSON.stringify([...set]));
}

let currentValidCode = null;
let currentSerial = null;
let currentUseMode = null; // 'github' | 'local'

function showResult(cls, html) {
  const el = document.getElementById('result');
  el.className = cls;
  el.innerHTML = html;
  el.style.display = 'block';
}

async function verify() {
  const secret = document.getElementById('secret').value.trim();
  const rawCode = document.getElementById('code').value.trim().toUpperCase();
  document.getElementById('useBtn').style.display = 'none';
  currentValidCode = null;

  if (!secret) { alert('비밀키를 입력하세요.'); return; }
  if (!rawCode) { alert('코드를 입력하세요.'); return; }

  localStorage.setItem('voucherSecretCache', secret); // 이 기기에서 다음부터 자동으로 채워지도록 기억

  const cleanCode = rawCode.replace(/-/g, ''); // 혹시 사람이 구분자를 넣어 타이핑해도 허용
  if (cleanCode.length !== SERIAL_LEN + SIG_LEN) {
    showResult('bad', `❌ 형식이 올바르지 않은 코드입니다. (${SERIAL_LEN + SIG_LEN}자리여야 함)`);
    return;
  }
  const serial = cleanCode.slice(0, SERIAL_LEN);
  const sig = cleanCode.slice(SERIAL_LEN);

  // 서명은 "일련번호"만으로 계산됩니다 — 금액/만료일은 코드 안에 없고 vouchers.json에서만 조회합니다.
  const expectedFull = await hmacHex(secret, serial);
  const expected = expectedFull.slice(0, sig.length).toUpperCase();

  if (expected !== sig) {
    showResult('bad', '❌ 위조되었거나 잘못된 코드입니다.<div class="detail">서명이 일치하지 않습니다.</div>');
    return;
  }

  // 서명은 정상 → 이제 금액/만료일/사용여부를 알기 위해 GitHub 조회가 반드시 필요합니다.
  let ghCfg = currentGhCfg;
  if (!ghConfigReady(ghCfg) && pendingEncryptedBlob) {
    ghCfg = (await tryAutoUnlockWithSecret(secret)) || ghCfg;
  }

  if (ghConfigReady(ghCfg)) {
    try {
      const { list } = await ghGetFile(ghCfg);
      const entry = list.find(v => v.serial === serial);
      if (!entry) {
        showResult('bad', '❌ 발급 기록에 없는 코드입니다 (GitHub 등록 목록 기준).<div class="detail">' +
          '서명은 맞지만 발급대장에 없습니다. 위조된 코드이거나, ' +
          '<b>사용완료된 지 1년이 넘게 지났거나 유효기간이 1년 넘게 지나 발급대장에서 정리(삭제)된 코드</b>일 수 있습니다.' +
          '</div>');
        return;
      }

      const detail = `금액 ${Number(entry.amount).toLocaleString()}원 · 만료 ${formatDate(entry.expiry)}까지`;
      const today = new Date();
      const todayStr = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}`;

      if (entry.expiry < todayStr) {
        showResult('expired', `⏰ 유효기간이 만료되었습니다.<div class="detail">${detail}</div>`);
        return;
      }
      if (entry.used) {
        showResult('used', `⚠️ 이미 사용 처리된 코드입니다.<div class="detail">${detail}<br>사용 시각: ${entry.usedAt || '-'}</div>`);
        return;
      }
      showResult('ok', `✅ 정상 상품권입니다.<div class="detail">${detail}</div>`);
      currentValidCode = cleanCode;
      currentSerial = serial;
      currentUseMode = 'github';
      document.getElementById('useBtn').style.display = 'block';
      return;
    } catch (e) {
      console.warn('GitHub 조회 실패:', e.message);
      showResult('expired', '⚠️ 서명은 정상이지만, 금액/유효기간/사용여부를 확인하지 못했습니다.<div class="detail">GitHub 조회 실패 — 인터넷 연결을 확인하세요.</div>');
      return;
    }
  }

  // GitHub 설정 자체가 없는 경우: 서명만 확인 가능하고, 금액/만료일/사용여부는 알 수 없음
  showResult('expired', '⚠️ 서명은 정상이지만, 금액/유효기간을 확인할 수 없습니다.<div class="detail">GitHub 설정이 없어 발급대장을 조회하지 못했습니다 — 인터넷 연결 또는 비밀키를 확인하세요.</div>');
  currentValidCode = cleanCode;
  currentSerial = serial;
  currentUseMode = 'local';
  document.getElementById('useBtn').style.display = 'block';
}

async function markUsed() {
  const btn = document.getElementById('useBtn');
  btn.disabled = true;
  try {
    if (currentUseMode === 'github') {
      const ghCfg = currentGhCfg;
      const usedAt = new Date().toISOString();
      await ghPutFile(
        ghCfg,
        (list) => {
          const idx = list.findIndex(v => v.serial === currentSerial);
          if (idx === -1) throw new Error('발급 기록을 찾을 수 없습니다.');
          if (list[idx].used) throw new Error('다른 기기에서 방금 먼저 사용 처리했습니다.');
          list[idx] = { ...list[idx], used: true, usedAt };
          return list;
        },
        `사용 처리: ${currentSerial}`
      );
      showResult('used', '✔️ 사용 처리 완료 (GitHub 공유 기록에 반영됨)');
    } else {
      const set = getUsedSet();
      set.add(currentValidCode);
      saveUsedSet(set);
      showResult('used', '✔️ 사용 처리 완료 (이 기기에만 기록됨, 오프라인 모드)');
    }
    btn.style.display = 'none';
  } catch (e) {
    alert(`사용 처리 실패: ${e.message}`);
    btn.disabled = false;
  }
}

function resetUsed() {
  if (confirm('이 기기에 기록된 사용 목록을 모두 초기화할까요?')) {
    localStorage.removeItem('usedVoucherCodes');
    alert('초기화되었습니다.');
  }
}

function resetSecretCache() {
  if (confirm('이 기기에 저장된 비밀키를 지울까요? (다음부터 다시 입력해야 합니다)')) {
    localStorage.removeItem('voucherSecretCache');
    document.getElementById('secret').value = '';
    alert('삭제되었습니다.');
  }
}

function resetGhConfigCache() {
  if (confirm('이 기기에 캐시된 GitHub 설정(owner/repo/token)을 지울까요? 다음 확인 시 비밀키로 다시 자동 해제를 시도합니다.')) {
    localStorage.removeItem('voucherGithubConfig');
    currentGhCfg = { owner: '', repo: '', branch: 'main', path: 'vouchers.json', token: '' };
    alert('삭제되었습니다. 페이지를 새로고침한 뒤 다시 확인해보세요.');
  }
}

function formatDate(yyyymmdd) {
  return `${yyyymmdd.slice(0,4)}-${yyyymmdd.slice(4,6)}-${yyyymmdd.slice(6,8)}`;
}
</script>
</body>
</html>
